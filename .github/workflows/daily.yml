name: Daily Rakuten Sales Fetch

on:
  schedule:
    # 毎日 JST 06:00 (UTC 21:00) に実行
    - cron: "0 21 * * *"
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write # data/ への commit に必要

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch yesterday's orders
        env:
          RAKUTEN_SERVICE_SECRET: ${{ secrets.RAKUTEN_SERVICE_SECRET }}
          RAKUTEN_LICENSE_KEY: ${{ secrets.RAKUTEN_LICENSE_KEY }}
        run: python src/fetch_orders.py

      - name: Aggregate
        run: python src/aggregate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi
